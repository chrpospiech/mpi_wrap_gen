[package]
name = "mpi_wrap_gen"
version = "1.0.1"
authors = ["C. Pospiech <pospiech-HD@t-online.de>"]
description = "Create wrapper files for MPI profiler"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
dynfmt2 = { version = "0.4.0", features = ["python"] }
lopdf = { version = "0.45.0", default-features = false, features = ["chrono", "jiff", "rayon"] }
phf = { version = "0.14.0", features = ["macros"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[dev-dependencies]
tempfile = "3"
