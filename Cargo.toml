[package]
name = "mpi_wrap_gen"
version = "0.3.0"
authors = ["C. Pospiech <pospiech-HD@t-online.de>"]
description = "Create wrapper files for MPI profiler"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dynfmt2 = { version = "0.3.0", features = ["python"] }
lopdf = "0.40.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[dev-dependencies]
tempfile = "3"
