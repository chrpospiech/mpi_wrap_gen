# File: config_xmp.yml
# Description: ~/tools/Rust/mpi_wrap_gen/src/config_xmp.yml
# Author: Dr. Christoph Pospiech

# This is a configuration file for mpi_wrap_gen, which generates C wrappers for MPI libraries.
# The configuration is in YAML format and specifies the settings for the wrapper generation.

# The name of the MPI the PDF file for the MPI standard containing the names of the MPI functions.
mpi_pdf: "/home/cp/Documents/MPI/mpi31-report.pdf"

# The name of the output file for the generated C wrapper.
output_file: "test_wrapper.c"

# The template definitions for the C wrapper functions.
# This section defines how the generated C functions should look.
templates:
  header: |
    // This file is generated by mpi_wrap_gen. Do not edit manually.
    // These are the initial lines of the file.

  ch_init: |
    // This is the begin for functions from chapter {chapter} of the MPI standard.

  ch_body: |
    // The body of the wrapper function will be generated here.
    // It will include the call to the corresponding MPI function.

  footer: |
    // This marks the end of the file.
